<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1F6D57">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ورشة الجلابيب">
<title>ورشة تفصيل الجلابيب</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap"></noscript>
<style>
  :root{
    --btn-radius:12px;
    --primary:#1F6D57;
    --primary-dark:#123C2F;
    --primary-light:#E7F1EA;
    --accent:#B8863B;
    --accent-dark:#8F6626;
    --bg:#F6F1E6;
    --card:#FFFFFF;
    --card-alt:#FFFCF6;
    --text:#242420;
    --muted:#847C6C;
    --danger:#A23B2C;
    --danger-light:#F6E3DD;
    --warn:#93691C;
    --warn-light:#FAF0D8;
    --info:#2F5673;
    --info-light:#E7EDF2;
    --ok:#1F6D57;
    --ok-light:#E7F1EA;
    --accent-light:#F3E4C8;
    --border:#E4D9BF;
    --stitch:#C9B48C;
    --heading:var(--primary-dark);
    --radius:16px;
    --radius-sm:10px;
    --shadow: 0 3px 14px rgba(18,60,47,0.08);
    --shadow-lift: 0 16px 40px rgba(18,60,47,0.18);
    --font-display:"El Messiri","Tajawal",sans-serif;
    --font-body:"IBM Plex Sans Arabic","Tajawal","Segoe UI",Tahoma,Arial,sans-serif;
  }

  /* ===== الوضع الليلي ===== */
  html[data-theme="dark"]{
    --bg:#171916;
    --card:#232622;
    --card-alt:#292B25;
    --text:#EDE8DC;
    --muted:#A79F8C;
    --border:#3A372E;
    --stitch:#4C4838;
    --heading:#8FD8BE;
    --primary-light:rgba(31,109,87,0.28);
    --danger-light:rgba(162,59,44,0.28);
    --warn-light:rgba(147,105,28,0.28);
    --info-light:rgba(47,86,115,0.28);
    --ok-light:rgba(31,109,87,0.28);
    --accent-light:rgba(184,134,59,0.28);
    --danger:#E0796A;
    --warn:#D9A93D;
    --info:#7BAFD4;
    --ok:#6FCDAA;
    --shadow:0 3px 14px rgba(0,0,0,0.4);
    --shadow-lift:0 16px 40px rgba(0,0,0,0.55);
  }
  html[data-theme="dark"] body{background:var(--bg);}
  html[data-theme="dark"] .modal-box{background:var(--card);}
  html[data-theme="dark"] .modal-close{background:var(--card-alt);}
  html[data-theme="dark"] .search-box input{background:var(--card-alt);color:var(--text);}
  html[data-theme="dark"] .field input, html[data-theme="dark"] .field select, html[data-theme="dark"] .field textarea{color:var(--text);}
  html[data-theme="dark"] nav.sidenav{background:var(--card);}
  html[data-theme="dark"] .btn.outline{background:var(--card);}
  html[data-theme="dark"] .toast{color:#fff;}
  .theme-toggle-btn{
    background:rgba(255,255,255,0.15);border:none;color:#fff;width:36px;height:36px;
    border-radius:10px;font-size:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0;
    margin-inline-start:6px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--font-body);
    background:var(--bg);
    color:var(--text);
    -webkit-tap-highlight-color:transparent;
  }

  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  /* ===== شاشة القفل ===== */
  #lockScreen{
    position:fixed;inset:0;
    background:
      repeating-linear-gradient(-45deg, rgba(255,255,255,0.035) 0 2px, transparent 2px 26px),
      linear-gradient(165deg,var(--primary-dark) 0%,#0D2A21 55%,var(--primary-dark) 100%);
    display:flex;align-items:center;justify-content:center;flex-direction:column;
    z-index:9999;color:#fff;padding:20px;text-align:center;
  }
  #lockScreen h1{font-family:var(--font-display);font-size:23px;font-weight:700;margin:2px 0 6px;letter-spacing:.2px;}
  #lockScreen p.sub{color:#CFE3DA;margin-top:0;margin-bottom:26px;font-size:13.5px;}
  .brand-emblem{
    width:74px;height:74px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-family:var(--font-display);font-size:32px;font-weight:700;color:var(--primary-dark);
    background:radial-gradient(circle at 32% 28%, #FFF6E2, var(--accent) 72%);
    box-shadow:0 8px 22px rgba(0,0,0,0.28), inset 0 0 0 3px rgba(255,255,255,0.35);
    margin-bottom:14px;border:2px dashed rgba(255,255,255,0.5);
  }
  .brand-emblem svg{width:52%;height:52%;stroke:var(--primary-dark);}
  .brand-emblem.sm{
    width:38px;height:38px;font-size:17px;margin-bottom:0;flex-shrink:0;
    box-shadow:0 3px 8px rgba(0,0,0,0.22), inset 0 0 0 2px rgba(255,255,255,0.35);
    border-width:1.5px;
  }
  .pin-dots{display:flex;gap:14px;margin-bottom:26px;}
  .pin-dot{width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,0.75);background:transparent;transition:.15s;}
  .pin-dot.filled{background:var(--accent);border-color:var(--accent);}
  .pin-dot.shake-err{background:var(--danger);border-color:var(--danger);}
  .keypad{display:grid;grid-template-columns:repeat(3,70px);gap:13px;}
  .keypad button{
    width:70px;height:70px;border-radius:50%;border:1px solid rgba(255,255,255,0.16);
    background:rgba(255,255,255,0.07);color:#fff;font-size:22px;font-weight:600;font-family:var(--font-display);
    display:flex;align-items:center;justify-content:center;transition:background .12s;
    touch-action:manipulation;-webkit-user-select:none;user-select:none;
  }
  .keypad button:active{background:var(--accent);border-color:var(--accent);}
  .keypad button.wide{font-size:14px;font-weight:500;font-family:var(--font-body);}
  #lockError{color:#F0B7A8;min-height:20px;font-size:13.5px;margin-bottom:6px;}
  .pin-input{-webkit-text-security:disc;text-security:disc;letter-spacing:4px;}
  .lock-shake{animation:shakeit .4s;}
  @keyframes shakeit{
    0%,100%{transform:translateX(0);}
    20%{transform:translateX(-10px);}
    40%{transform:translateX(10px);}
    60%{transform:translateX(-8px);}
    80%{transform:translateX(8px);}
  }

  /* ===== الهيكل العام ===== */
  #app{display:none;min-height:100vh;padding-bottom:28px;}
  header.topbar{
    background:linear-gradient(120deg,var(--primary) 0%,var(--primary-dark) 100%);
    color:#fff;padding:20px 18px 24px;
    display:flex;align-items:center;justify-content:space-between;
    position:sticky;top:0;z-index:50;box-shadow:var(--shadow);
    border-radius:0 0 22px 22px;
    background-image:
      repeating-linear-gradient(45deg, rgba(255,255,255,0.035) 0 2px, transparent 2px 22px),
      linear-gradient(120deg,var(--primary) 0%,var(--primary-dark) 100%);
  }
  .topbar-brand{display:flex;align-items:center;gap:11px;}
  .menu-btn{
    background:rgba(255,255,255,0.15);border:none;color:#fff;width:36px;height:36px;
    border-radius:10px;font-size:17px;display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  header.topbar h2{margin:0;font-family:var(--font-display);font-size:19.5px;font-weight:700;}
  header.topbar .date{font-size:11.5px;color:#CFE3DA;margin-top:2px;}
  main{padding:14px;max-width:900px;margin:-12px auto 0;position:relative;z-index:2;}
  .page{display:none;}
  .page.active{display:block;animation:fadein .2s;}
  @keyframes fadein{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

  .sidenav-overlay{
    position:fixed;inset:0;background:rgba(18,29,24,0.55);z-index:69;
    opacity:0;pointer-events:none;transition:opacity .22s;
  }
  .sidenav-overlay.active{opacity:1;pointer-events:auto;}
  nav.sidenav{
    position:fixed;top:0;bottom:0;right:0;width:78vw;max-width:300px;background:var(--card);
    z-index:70;box-shadow:-10px 0 30px rgba(18,60,47,0.25);
    transform:translateX(100%);transition:transform .25s;
    display:flex;flex-direction:column;padding:14px 10px;overflow-y:auto;
    overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
  }
  nav.sidenav.open{transform:translateX(0);}
  .sidenav-head{
    display:flex;align-items:center;gap:11px;padding:6px 8px 16px;margin-bottom:8px;
    border-bottom:2px dashed var(--stitch);
  }
  .sidenav-head h2{margin:0;font-family:var(--font-display);font-size:15.5px;color:var(--heading);}
  .sidenav-head .date{font-size:11px;color:var(--muted);margin-top:2px;}
  .sidenav-head .modal-close{margin-inline-start:auto;}
  nav.sidenav .navbtn{
    flex-direction:row;justify-content:flex-start;gap:12px;
    padding:13px 12px;border-radius:12px;font-size:14.5px;font-weight:600;
    color:var(--text);text-align:right;width:100%;
  }
  nav.sidenav .navbtn .ic{font-size:19px;}
  nav.sidenav .navbtn.active{background:var(--primary-light);color:var(--heading);}
  nav.sidenav .navbtn.active .ic{background:none;padding:0;}
  nav.sidenav .navbtn+.navbtn{margin-top:2px;}

  /* ===== بطاقات ===== */
  .grid-cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
  .stat-card{
    background:var(--card);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);
    border-right:none;position:relative;overflow:hidden;
    display:flex;align-items:center;gap:11px;
  }
  .stat-card::before{
    content:"";position:absolute;top:0;bottom:0;right:0;width:4px;
    background:repeating-linear-gradient(180deg,var(--primary) 0 6px,transparent 6px 11px);
  }
  .stat-card.warn::before{background:repeating-linear-gradient(180deg,var(--warn) 0 6px,transparent 6px 11px);}
  .stat-card.danger::before{background:repeating-linear-gradient(180deg,var(--danger) 0 6px,transparent 6px 11px);}
  .stat-ic{
    width:38px;height:38px;border-radius:11px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;font-size:18px;
    background:var(--primary-light);
  }
  .stat-card.warn .stat-ic{background:var(--warn-light);}
  .stat-card.danger .stat-ic{background:var(--danger-light);}
  .stat-card .num{font-family:var(--font-display);font-size:20px;font-weight:700;color:var(--heading);line-height:1.2;}
  .stat-card.warn .num{color:var(--warn);}
  .stat-card.danger .num{color:var(--danger);}
  .stat-card .lbl{font-size:11.5px;color:var(--muted);margin-top:1px;}

  .avatar{
    display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;
    width:34px;height:34px;border-radius:10px;font-family:var(--font-display);font-weight:700;font-size:14.5px;
    background:var(--primary-light);color:var(--heading);margin-left:9px;vertical-align:middle;
  }
  .avatar.accent{background:#F3E4C8;color:var(--accent-dark);}
  .name-row{display:flex;align-items:center;}

  .section-title{
    font-family:var(--font-display);font-size:16.5px;font-weight:700;margin:20px 0 12px;
    color:var(--heading);display:flex;align-items:center;gap:7px;
    padding-bottom:8px;border-bottom:2px dashed var(--stitch);
  }

  .card{
    background:var(--card);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);
    margin-bottom:10px;border:1px solid var(--border);
  }
  .card .row{display:flex;justify-content:space-between;align-items:center;}
  .card h3{margin:0 0 6px;font-family:var(--font-display);font-size:15.5px;font-weight:600;color:var(--text);}
  .card .meta{font-size:12.5px;color:var(--muted);margin:2px 0;}
  .empty-msg{text-align:center;color:var(--muted);padding:30px 10px;font-size:13.5px;}

  .badge{display:inline-flex;align-items:center;gap:5px;padding:3px 11px;border-radius:20px;font-size:11.5px;font-weight:700;}
  .badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;}
  .badge.progress{background:var(--warn-light);color:var(--warn);}
  .badge.ready{background:var(--info-light);color:var(--info);}
  .badge.done{background:var(--ok-light);color:var(--ok);}
  .badge.late{background:var(--danger-light);color:var(--danger);}

  /* ===== خانات المقاسات الملوّنة (لسهولة المتابعة بنظرة واحدة) ===== */
  .meas-row{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0;}
  .meas-chip{
    display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:20px;
    font-size:12px;font-weight:600;white-space:nowrap;
  }
  .meas-chip .meas-lbl{opacity:.8;font-weight:500;}
  .meas-chip.m-chest{background:var(--info-light);color:var(--info);}
  .meas-chip.m-waist{background:var(--warn-light);color:var(--warn);}
  .meas-chip.m-length{background:var(--primary-light);color:var(--heading);}
  .meas-chip.m-sleeve{background:var(--accent-light);color:var(--accent-dark);}
  .meas-chip.m-shoulder{background:var(--danger-light);color:var(--danger);}
  .field.m-chest input{border-inline-start:4px solid var(--info);}
  .field.m-waist input{border-inline-start:4px solid var(--warn);}
  .field.m-length input{border-inline-start:4px solid var(--primary);}
  .field.m-sleeve input{border-inline-start:4px solid var(--accent);}
  .field.m-shoulder input{border-inline-start:4px solid var(--danger);}

  /* ===== أزرار ===== */
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    padding:12px 16px;border-radius:var(--btn-radius,12px);border:none;font-size:14.5px;font-weight:700;
    font-family:var(--font-display);
    background:var(--primary);color:#fff;width:100%;position:relative;overflow:hidden;
    box-shadow:0 2px 8px rgba(18,60,47,0.18);transition:transform .08s, background .12s;
  }
  .btn::after{
    content:"";position:absolute;inset:0 0 auto 0;height:50%;
    background:linear-gradient(rgba(255,255,255,0.16),transparent);pointer-events:none;
  }
  .btn:active{background:var(--primary-dark);transform:translateY(1px);}
  .btn.secondary{background:var(--primary-light);color:var(--heading);box-shadow:none;}
  .btn.secondary::after{display:none;}
  .btn.outline{background:#fff;color:var(--primary);border:1.5px solid var(--primary);box-shadow:none;}
  .btn.outline::after{display:none;}
  .btn.danger{background:var(--danger);}
  .btn.accent{background:var(--accent);color:#fff;}
  .btn.sm{padding:8px 12px;font-size:13px;width:auto;border-radius:calc(var(--btn-radius,12px) - 3px);}
  .btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;}
  .btn-row .btn{width:auto;flex:1;min-width:90px;}
  .fab{
    position:fixed;left:16px;bottom:22px;width:56px;height:56px;border-radius:50%;
    background:linear-gradient(145deg,var(--accent),var(--accent-dark));color:#fff;font-size:25px;border:none;
    box-shadow:0 6px 16px rgba(143,102,38,0.4), inset 0 0 0 3px rgba(255,255,255,0.18);
    z-index:55;display:flex;align-items:center;justify-content:center;
  }

  /* ===== نماذج ===== */
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px;font-weight:600;}
  .field input, .field select, .field textarea{
    width:100%;padding:11px 12px;border-radius:10px;border:1.5px solid var(--border);
    font-size:14.5px;background:var(--card-alt);color:var(--text);
  }
  .field input:focus, .field select:focus, .field textarea:focus{outline:none;border-color:var(--primary);}
  .field-row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

  .search-box{margin-bottom:12px;}
  .search-box input{
    width:100%;padding:11px 14px;border-radius:12px;border:1.5px solid var(--border);font-size:14.5px;background:#fff;
  }

  /* ===== مودال ===== */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(18,29,24,0.55);z-index:200;
    display:none;align-items:flex-end;justify-content:center;
    overscroll-behavior:contain;
  }
  .modal-overlay.active{display:flex;}
  .modal-box{
    background:#fff;width:100%;max-width:520px;border-radius:22px 22px 0 0;
    max-height:88vh;overflow-y:auto;padding:20px 18px 18px;animation:slideup .22s;
    box-shadow:var(--shadow-lift);position:relative;
    overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
  }
  .modal-box::before{
    content:"";position:absolute;top:9px;right:50%;transform:translateX(50%);
    width:38px;height:4px;border-radius:4px;background:var(--border);
  }
  @keyframes slideup{from{transform:translateY(30px);opacity:0;}to{transform:translateY(0);opacity:1;}}
  .modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;margin-top:6px;}
  .modal-head h3{margin:0;font-family:var(--font-display);font-size:17.5px;font-weight:700;color:var(--heading);}
  .modal-close{background:var(--bg);border:none;border-radius:50%;width:34px;height:34px;font-size:16px;color:var(--muted);}

  @media (min-width:640px){
    .grid-cards{grid-template-columns:repeat(4,1fr);}
  }
  .toast{
    position:fixed;bottom:30px;right:50%;transform:translateX(50%);
    background:var(--primary-dark);color:#fff;padding:10px 20px;border-radius:30px;font-size:13.5px;
    z-index:300;box-shadow:0 6px 18px rgba(18,60,47,0.35);opacity:0;transition:.25s;pointer-events:none;
  }
  .toast.show{opacity:1;}
  hr.sep{border:none;border-top:2px dashed var(--stitch);margin:12px 0;}
  .alert-banner{
    display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border-radius:var(--radius);
    margin-bottom:10px;font-size:13.5px;line-height:1.6;box-shadow:var(--shadow);border:1px solid transparent;
  }
  .alert-banner.danger{background:var(--danger-light);color:var(--danger);border-color:rgba(162,59,44,0.18);}
  .alert-banner.warn{background:var(--warn-light);color:var(--warn);border-color:rgba(147,105,28,0.18);}
  .alert-banner b{display:block;font-family:var(--font-display);font-size:14.5px;font-weight:700;margin-bottom:2px;}
  .alert-banner .ic{font-size:19px;}
  .alert-banner .close-x{margin-inline-start:auto;background:none;border:none;color:inherit;font-size:15px;opacity:.7;}
  .small-link{background:none;border:none;color:var(--primary);font-size:13px;font-weight:700;padding:6px;}
  .tag-late-text{color:var(--danger);font-weight:700;}
</style>

<!-- privacy stylesheet (added) -->
<link rel="stylesheet" href="privacy.css">

</head>
<body>

<!-- ===================== شاشة القفل ===================== -->
<div id="lockScreen">
  <div class="brand-emblem"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><line x1="20" y1="4" x2="8" y2="20"/></svg></div>
  <h1 id="lockTitle">ورشة تفصيل الجلابيب</h1>
  <p class="sub">أدخل الرقم السري للدخول</p>
  <div id="lockError"></div>
  <div class="pin-dots" id="pinDots">
    <div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div>
  </div>
  <div class="keypad" id="keypad">
    <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
    <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
    <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
    <button class="wide" data-k="clear">مسح</button><button data-k="0">0</button><button class="wide" data-k="back">⌫</button>
  </div>
</div>

<!-- ===================== التطبيق ===================== -->
<div id="app">
  <header class="topbar">
    <div class="topbar-brand">
      <button class="menu-btn" onclick="openSideNav()" aria-label="القائمة">☰</button>
      <div class="brand-emblem sm"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><line x1="20" y1="4" x2="8" y2="20"/></svg></div>
      <div>
